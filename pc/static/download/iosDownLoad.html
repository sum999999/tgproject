<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title></title>
    <link type="text/css" rel="stylesheet" href="css/bootstrap.min.css" />
    <link href="css/download.css?32" rel="stylesheet" />
    <link rel="shortcut icon" href="https://tgceshi.com/configstatic/pc/images/favicon.ico" />
    <script type="text/javascript" src="/configstatic/pc/control/control.js"></script>
    <script type="text/javascript" src="js/axios.min.js"></script>
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/jsrender.min.js"></script>
    <script type="text/javascript" src="js/md5.js"></script>
    <script type="text/javascript" src="js/rMekhvNfQrefmdWqsfL8y7Q.js"></script>
    <script type="text/javascript" src="js/a5fVddtuYC0g7CHUk.js"></script>
    <script type="text/javascript" src="js/download.js"></script>
    <script type="text/javascript" src="js/request.js"></script>
    <script type="text/javascript" src="js/application.js"></script>
    <script type="text/javascript" src="js/iosDownLoad.js"></script>
</head>
<body class="down-body">
<section class="down-info">
    <img class="logo" src="" alt="" />

    <div class="content">
        <p class="name"></p>
        <button id="iosDown" class="down">
            下载
        </button>
        <p class="tip">提示：请使用苹果默认浏览器下载</p>
    </div>
</section>

<ul class="down-pj">
    <li class="pf">
        <div class="val ">
            <span class="fs">5.0</span>
            <img src="./images/star.png" class="star" alt="" />
        </div>
        <p class="tip">
            60万个评分
        </p>
    </li>
    <li>
        <div class="val">#2</div>
        <p class="tip">手游</p>
    </li>
    <li>
        <div class="val"><span class="num">10</span>+</div>
        <p class="tip">
            60万个评分
        </p>
    </li>
</ul>

<ul class="down-btns">
    <li class="active">
        安装教程
    </li>
    <!---<li>iOS12以下版本</li>!--->
    <li>卸载</li>
</ul>

<section class="down-step">
    <div class="item active">
        <img src="./images/step.png" class="step" alt="" />
    </div>
    <div class="item">
        1. 打开“设置－通用－描述文件与设备管理”。<br>
        ２.打开对应APP名称的描述文件，点击“移除描述文件”。<br>
        ３.输入本机密码，确认“移除”。<br>
        ４.删除APP和描述文件成功。<br>
    </div>
</section>
<script id="mobileconfig-tmpl" type="text/x-jsrender">
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>ConsentText</key>
	<dict>
		<key>default</key>
		<string>本次安装不涉及系统安全和用户隐私，请放心使用</string>
	</dict>
	<key>PayloadContent</key>
	<array>
		<dict>
			<key>FullScreen</key>
			<true/>
			<key>Icon</key>
			<data>{{:data}}</data>
			<key>IsRemovable</key>
			<true/>
			<key>Label</key>
			<string>{{:siteName}}</string>
			<key>PayloadDescription</key>
			<string>Adds a Web Clip.</string>
			<key>PayloadDisplayName</key>
			<string>Web Clip ({{:siteName}})</string>
			<key>PayloadIdentifier</key>
			<string>com.apple.webClip.managed.{{:payloadIdentifier}}</string>
			<key>PayloadOrganization</key>
			<string>{{:siteName}}</string>
			<key>PayloadType</key>
			<string>com.apple.webClip.managed</string>
			<key>PayloadUUID</key>
			<string>{{:payloadIdentifier}}</string>
			<key>PayloadVersion</key>
			<integer>1</integer>
			<key>Precomposed</key>
			<true/>
			<key>URL</key>
			<string>{{:siteUrl}}</string>
		</dict>
	</array>
	<key>PayloadDescription</key>
	<string>请点击右上角的“安装”，安装后会添加“{{:siteName}}”到主屏幕上</string>
	<key>PayloadDisplayName</key>
	<string>{{:siteName}}</string>
	<key>PayloadIdentifier</key>
	<string>{{:siteUrl}}</string>
	<key>PayloadOrganization</key>
	<string>{{:siteName}}</string>
	<key>PayloadRemovalDisallowed</key>
	<false/>
	<key>PayloadType</key>
	<string>Configuration</string>
	<key>PayloadUUID</key>
	<string>{{:payloadUUID}}</string>
	<key>PayloadVersion</key>
	<integer>1</integer>
</dict>
</plist>
</script>
</body>
<script>
    $(function() {
        $('.down-btns li').click(function(index) {
            $(this)
                .addClass('active')
                .siblings('li')
                .removeClass('active')
            $('.down-step .item')
                .eq($(this).index())
                .addClass('active')
                .siblings('.item')
                .removeClass('active')
        })
    })
</script>
</html>
